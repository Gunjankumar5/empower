<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Alert History - EMPOWER SAFE">
  <title>History - EMPOWER SAFE</title>
  <link rel="stylesheet" href="/styles.css">
  <!-- Leaflet.js for map modal -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>
<body data-page="history">
  <nav class="navbar">
    <div class="navbar-content">
      <a href="/" class="navbar-brand">🛡️ EMPOWER SAFE</a>
      <ul class="navbar-menu">
        <li><a href="/dashboard.html">Dashboard</a></li>
        <li><a href="/contacts.html">Contacts</a></li>
        <li><a href="/profile.html">Profile</a></li>
        <li><a href="/map.html">Map</a></li>
        <li><a href="/features.html">Features</a></li>
        <li><a href="/history.html">History</a></li>
        <li><button id="logoutBtn" class="btn btn-sm btn-danger">Logout</button></li>
      </ul>
      <button class="navbar-toggle">☰</button>
    </div>
  </nav>

  <main class="page">
    <section class="page-content">
      <div class="container" style="padding-top: 32px; padding-bottom: 32px;">
        <div class="flex-between" style="gap: 16px; flex-wrap: wrap; margin-bottom: 24px;">
          <div>
            <h1 style="margin-bottom: 8px;">Alert History</h1>
            <p>Review all triggered safety alerts.</p>
          </div>
          <button id="refreshHistoryBtn" class="btn btn-secondary">Refresh</button>
        </div>

        <div id="historyEmptyState" class="card hidden" style="text-align: center;">
          <p style="margin: 0;">No alerts yet.</p>
        </div>

        <div class="card" style="overflow-x: auto;">
          <table style="width: 100%; border-collapse: collapse;">
            <thead>
              <tr>
                <th style="text-align: left; padding: 12px;">Date</th>
                <th style="text-align: left; padding: 12px;">Location</th>
                <th style="text-align: left; padding: 12px;">Type</th>
                <th style="text-align: left; padding: 12px;">Contacts Notified</th>
                <th style="text-align: left; padding: 12px;">Status</th>
                <th style="text-align: left; padding: 12px;">Action</th>
              </tr>
            </thead>
            <tbody id="historyTableBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="/app.js"></script>
  <script src="/advanced-location.js"></script>
  <script src="/pages.js"></script>
</body>
</html>
