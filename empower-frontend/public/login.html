<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to EMPOWER SAFE">
  <title>Login - EMPOWER SAFE</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="login">
  <nav class="navbar">
    <div class="navbar-content">
      <a href="/" class="navbar-brand">🛡️ EMPOWER SAFE</a>
      <button class="navbar-toggle">☰</button>
    </div>
  </nav>

  <main class="page">
    <section class="page-content">
      <div class="container-sm" style="padding-top: 48px; padding-bottom: 48px;">
        <div class="card" style="max-width: 480px; margin: 0 auto;">
          <div style="text-align: center; margin-bottom: 32px;">
            <div class="feature-icon" style="margin: 0 auto 16px;">🛡️</div>
            <h1>Welcome Back</h1>
            <p>Sign in to your EMPOWER SAFE account.</p>
          </div>

          <form id="loginForm" style="display: grid; gap: 18px;">
            <div class="form-group">
              <label for="email">Email Address</label>
              <input id="email" type="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <input id="password" type="password" placeholder="••••••••" required>
            </div>
            <div id="authError"></div>
            <button id="loginBtn" type="submit" class="btn btn-primary btn-lg">
              <span id="loginText">Sign In</span>
              <span id="loginSpinner" class="hidden" style="margin-left: 10px;"><span class="spinner"></span></span>
            </button>
          </form>

          <p style="text-align: center; margin-top: 24px;">
            New here? <a href="/register.html">Create an account</a>
          </p>
        </div>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
  <script src="/pages.js"></script>
</body>
</html>
